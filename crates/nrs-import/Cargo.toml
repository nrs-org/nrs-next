[package]
name = "nrs-import"
version.workspace = true
edition.workspace = true

[dependencies]
boa_engine = { version = "0.22.0", optional = true }
nrs-core = { path = "../nrs-core" }
nrs-entry-store = { path = "../nrs-entry-store" }
nrs-store = { path = "../nrs-store" }
roxmltree = "0.21.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { version = "1.0.151", optional = true }
time = { version = "0.3.54", features = ["parsing", "macros"] }

[features]
scripting = ["dep:boa_engine", "dep:serde_json"]

# Re-parsing without scripts would revert every script-driven
# contributor split, so the resync tool only exists with them.
[[bin]]
name = "resync"
required-features = ["scripting"]

[[bin]]
name = "strip_check"
required-features = ["scripting"]
