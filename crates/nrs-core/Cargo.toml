[package]
name = "nrs-core"
version.workspace = true
edition.workspace = true

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std"], optional = true }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
serde_json = "1"

[features]
# Perf-comparison-only: benchmarks `faer`'s symmetric eigensolver against
# the hand-rolled `householder_ql_eigen`/`jacobi_eigen`. Not on by
# default — nrs-core is otherwise dependency-free by design (see
# linalg.rs).
faer-eigen = ["dep:faer"]
# JSON (de)serialization of the persisted types, for nrs-store's
# JSON-in-TEXT-column blobs (INFRA.md §5.1, §11). Off by default so the
# pure/WASM build stays lean.
serde = ["dep:serde"]

[[bench]]
name = "score"
harness = false
