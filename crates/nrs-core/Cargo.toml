[package]
name = "nrs-core"
version.workspace = true
edition.workspace = true

[dependencies]
rayon = "1.12.0"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
serde_json = "1"

[features]
# JSON (de)serialization of the persisted types, for nrs-store's
# JSON-in-TEXT-column blobs (INFRA.md §5.1, §11). Off by default so the
# pure/WASM build stays lean.
serde = ["dep:serde"]

[[bench]]
name = "score"
harness = false
