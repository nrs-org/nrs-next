[package]
name = "nrs-store"
version.workspace = true
edition.workspace = true

[dependencies]
nrs-core = { path = "../nrs-core", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3.54"
ulid = "1"
